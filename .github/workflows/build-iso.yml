name: Build Kian OS ISO

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user to kiantaei
        run: |
          git config user.name "kiantaei"
          git config user.email "kiantaei@users.noreply.github.com"

      - name: Install host build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y binutils lld xorriso mtools nasm qemu-system-x86 \
            grub-pc-bin grub-efi-amd64 curl git

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Add x86_64-unknown-none target
        run: |
          rustup target add x86_64-unknown-none --toolchain nightly

      - name: Build kernel + ISO
        run: |
          make iso

      - name: Test boot headless in QEMU (serial log)
        run: |
          timeout 30 qemu-system-x86_64 -m 2G -smp 2 -cdrom kian-os-0.2.0.iso -boot d -serial stdio -display none -vga none > qemu-boot.log 2>&1 || true
          echo "===== QEMU BOOT LOG ====="
          cat qemu-boot.log || true

      - name: Generate SHA256
        run: sha256sum kian-os-0.2.0.iso > kian-os-0.2.0.iso.sha256

      - name: Get version tag
        id: tag
        run: echo "tag=0.2.0-horizon-${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Kian OS 0.2.0 "Horizon" (build ${{ github.run_id }})
          body: |
            Kian OS 0.2.0 "Horizon" — bootable hybrid BIOS+UEFI ISO.
            Default login: kian / kian (hashed).
            Time zone: Asia/Tehran (UTC+03:30, no DST).
            Build: ${{ github.run_id }}
          files: |
            kian-os-0.2.0.iso
            kian-os-0.2.0.iso.sha256
          draft: false
          prerelease: true
          generate_release_notes: false

      - name: Commit build artifacts back to repo
        run: |
          git add kian-os-0.2.0.iso kian-os-0.2.0.iso.sha256 || true
          git commit -m "chore: publish kian-os-0.2.0.iso build ${{ github.run_id }}" || true
          git push origin master || true
