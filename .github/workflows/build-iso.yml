name: Build Kian OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user to kiantaei
        run: |
          git config user.name "kiantaei"
          git config user.email "kiantaei@users.noreply.github.com"

      - name: Install host build tools
        run: |
          sudo apt-get update && sudo apt-get install -y lld xorriso mtools qemu-system-x86 build-essential git

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview

      - name: Add x86_64-unknown-none target
        run: |
          rustup target add x86_64-unknown-none --toolchain nightly

      - name: Build kernel + ISO
        run: |
          make iso

      - name: Smoke test in QEMU
        run: |
          timeout 30 qemu-system-x86_64 -cdrom kian-os-0.2.0.iso -m 512 -display none -serial file:serial.log || true
          echo "----- serial.log -----"
          cat serial.log || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kian-os-iso
          path: |
            kian-os-0.2.0.iso
            kian-os-0.2.0.iso.sha256
            serial.log

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.2.0-build-${{ github.run_number }}
          name: Kian OS 0.2.0 build ${{ github.run_number }}
          files: |
            kian-os-0.2.0.iso
            kian-os-0.2.0.iso.sha256
