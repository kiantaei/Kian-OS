name: Build Kian OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user to kiantaei
        run: |
          git config user.name "kiantaei"
          git config user.email "kiantaei@users.noreply.github.com"

      - name: Install host build tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld llvm xorriso mtools qemu-system-x86 socat imagemagick build-essential git

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview

      - name: Add x86_64-unknown-none target
        run: |
          rustup target add x86_64-unknown-none --toolchain nightly

      - name: Build kernel + ISO
        run: |
          make iso

      - name: Install debug tools
        run: sudo apt-get install -y socat imagemagick

      - name: QEMU boot test with screenshot
        run: |
          qemu-system-x86_64 -cdrom kian-os-0.2.0.iso -m 512 -vga std -display none -no-reboot \
            -d int,cpu_reset,guest_errors -D qemu-debug.log \
            -serial file:serial.log -debugcon file:debugcon.log \
            -monitor unix:/tmp/qemu.sock,server,nowait &
          QPID=$!
          sleep 12
          echo "screendump /tmp/shot.ppm" | socat - unix-connect:/tmp/qemu.sock || true
          sleep 1
          convert /tmp/shot.ppm shot.png || true
          kill $QPID || true
          echo "----- serial.log -----"; cat serial.log || true
          echo "----- debugcon.log -----"; cat debugcon.log || true
          echo "----- qemu-debug.log (first 40 lines) -----"; head -40 qemu-debug.log || true
          echo "----- qemu-debug.log (last 20 lines) -----"; tail -20 qemu-debug.log || true

      - name: GUI login test with screenshot
        run: |
          qemu-system-x86_64 -cdrom kian-os-0.2.0.iso -m 512 -vga std -display none -no-reboot \
            -serial file:gui-serial.log -monitor unix:/tmp/qemu2.sock,server,nowait &
          QPID=$!
          sleep 12
          # log in (kian/kian); AUTOSTART_GUI then boots the desktop
          for k in k i a n ret k i a n ret; do
            echo "sendkey $k" | socat - unix-connect:/tmp/qemu2.sock || true
            sleep 0.3
          done
          sleep 8
          echo "screendump /tmp/gui.ppm" | socat - unix-connect:/tmp/qemu2.sock || true
          sleep 1
          convert /tmp/gui.ppm gui.png || true
          kill $QPID || true
          echo "----- gui-serial.log (last 30 lines) -----"
          tail -30 gui-serial.log || true

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kian-debug
          path: |
            shot.png
            gui.png
            serial.log
            gui-serial.log
            debugcon.log
            qemu-debug.log
            kian-os-0.2.0.iso
            kian-os-0.2.0.iso.sha256

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.2.0-build-${{ github.run_number }}
          name: Kian OS 0.2.0 build ${{ github.run_number }}
          files: |
            kian-os-0.2.0.iso
            kian-os-0.2.0.iso.sha256
