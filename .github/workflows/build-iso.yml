name: Build Kian OS ISO

# Builds the Kian OS ISO with live-build on the ubuntu-latest runner
# (Ubuntu 24.04 noble — the same release the OS is based on), runs a REAL
# QEMU boot test (serial login as kian/live, apt/calamares/persistence
# checks, desktop screenshots) and uploads the ISO to GitHub Releases.
# All results shown are real build/test outputs.

on:
  push:
    # Branches AND tags: without `tags` a `git push origin v1.0.0` matches no
    # workflow at all, so the "Publish tagged release (v*)" step could never
    # run. Path filters are ignored by GitHub for tag pushes.
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies (live-build + QEMU test tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin syslinux-common isolinux mtools \
            binutils qemu-system-x86 expect socat netpbm git python3-yaml

      - name: Profile sanity checks
        run: |
          bash -n build.sh
          bash -n scripts/ci-boot-test.sh
          bash -n live/auto/config
          for hook in live/config/hooks/*.hook.chroot; do
            bash -n "$hook"
          done
          for tool in kian-install kian-persist xenox kian-cleanup-live-only; do
            bash -n "live/config/includes.chroot/usr/local/bin/$tool"
          done
          python3 -c "import ast; ast.parse(open('live/config/includes.chroot/usr/local/bin/kian-welcome').read())"
          python3 -c "import yaml; yaml.safe_load(open('live/config/includes.chroot/etc/calamares/settings.conf'))"
          test -f live/config/includes.chroot/etc/os-release
          grep -q "ID=kian" live/config/includes.chroot/etc/os-release
          grep -q "ID_LIKE=.*ubuntu" live/config/includes.chroot/etc/os-release
          test -f live/config/includes.chroot/etc/calamares/branding/kian/branding.desc
          test -f live/config/includes.chroot/usr/lib/x86_64-linux-gnu/calamares/modules/automirror/main.py
          echo "profile sanity checks passed"

      - name: Build ISO with live-build
        run: sudo ./build.sh

      - name: Checksums
        run: |
          cd live
          ls -lh kian-os-*.iso kian-os-*.sha256
          cat kian-os-*.sha256

      # The ISO is published even if the GUI boot test fails, so the artifact
      # is never lost; the run is then marked failed by the final gate below
      # and the release notes state the boot-test outcome honestly.
      - name: Real QEMU boot test (BIOS + serial login + desktop)
        id: boottest
        continue-on-error: true
        timeout-minutes: 60
        run: |
          ISO=$(ls live/kian-os-*.iso | head -n1)
          bash scripts/ci-boot-test.sh "$ISO" build/test
          cat build/test/boot-test-summary.txt
          echo "----- serial transcript (first 120 lines) -----"
          head -120 build/test/kian-serial-transcript.txt || true
          echo "----- serial transcript (last 80 lines) -----"
          tail -80 build/test/kian-serial-transcript.txt || true

      - name: Upload build artifacts (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kian-os-1.0.0-build
          path: |
            live/kian-os-*.iso
            live/kian-os-*.sha256
            build/test/*
          if-no-files-found: warn

      - name: Publish rolling release (main)
        if: always() && github.ref == 'refs/heads/main' && hashFiles('live/kian-os-*.iso') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Kian OS 1.0 rolling build (Ubuntu 24.04 base)"
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Automated rolling build of Kian OS 1.0 "Horizon" — Ubuntu 24.04 LTS base.

            - commit: ${{ github.sha }}
            - built with live-build on the ubuntu-latest runner (noble)
            - QEMU boot test: **${{ steps.boottest.outcome }}**

            Boot it in VMware (primary target), QEMU or VirtualBox.
            Live login: `kian` / `live`. The Welcome window opens on the
            desktop: graphical installer (Calamares), offline CLI installer
            (`sudo kian-install`), and real persistence (`sudo kian-persist`).
          files: |
            live/kian-os-*.iso
            live/kian-os-*.sha256

      - name: Publish tagged release (v*)
        if: always() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && hashFiles('live/kian-os-*.iso') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Kian OS ${{ github.ref_name }}"
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Kian OS ${{ github.ref_name }} "Horizon" — Ubuntu 24.04 LTS base,
            XFCE desktop, Calamares graphical installer, real live persistence.

            See README.md for details and the verification checklist.

            - QEMU boot test: **${{ steps.boottest.outcome }}**
          files: |
            live/kian-os-*.iso
            live/kian-os-*.sha256

      # Keep the run honest: the ISO is already uploaded, but a failed boot
      # test must still turn the workflow red.
      - name: Fail the run if the boot test failed
        if: steps.boottest.outcome == 'failure'
        run: |
          echo "::error::QEMU boot test failed. The ISO was uploaded but is marked as failing in the release notes."
          exit 1
