name: Build Kian OS ISO

# Builds the Linux-based Kian OS ISO with archiso inside an official
# archlinux container, runs a REAL QEMU boot test (serial login as kian,
# gcc/python/pacman checks, desktop screenshots) and uploads the ISO to
# GitHub Releases. All results shown are real build/test outputs.

on:
  push:
    # Branches AND tags: without `tags` a `git push origin v0.4.0` matches no
    # workflow at all, so the "Publish tagged release (v*)" step could never
    # run. Path filters are ignored by GitHub for tag pushes.
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm archiso grub syslinux mtools dosfstools \
            qemu-desktop expect socat netpbm git

      - name: Profile sanity checks
        run: |
          bash -n archiso/kian/profiledef.sh
          bash -n build.sh
          bash -n scripts/ci-boot-test.sh
          bash -n scripts/ci-install-test.sh
          bash -n archiso/kian/airootfs/usr/local/bin/kian-setup
          bash -n archiso/kian/airootfs/usr/local/bin/kian-install
          bash -n archiso/kian/airootfs/usr/local/bin/kian-persist
          bash -n archiso/kian/airootfs/usr/local/bin/kianinstall
          bash -n archiso/kian/airootfs/usr/local/bin/kian-install-gui
          bash -n archiso/kian/airootfs/usr/local/bin/kian-apply
          bash -n archiso/kian/airootfs/usr/local/bin/kian-panel-position-fix
          bash -n archiso/kian/airootfs/usr/local/bin/kian-trust-desktop
          bash -n archiso/kian/airootfs/usr/bin/xenox
          bash -n archiso/kian/airootfs/usr/local/share/kian-ci/verify-commands.sh
          # the pinned kianinstall fork must be reachable before we spend time
          # building an ISO (ls-remote = plain HTTPS query, works everywhere)
          echo "checking kianinstall fork pinned commit ..."
          git ls-remote https://github.com/kiantaei/kianinstall.git refs/tags/kianinstall-v4.5
          git ls-remote https://github.com/kiantaei/kianinstall.git refs/tags/kianinstall-v4.5 | grep -q 17965c0d614d157290bb4324acff1c807d1b5e73 \
            || { echo "ERROR: pinned kianinstall commit 17965c0d (tag kianinstall-v4.5) is not reachable"; exit 1; }
          echo "kianinstall fork pinned commit reachable"

      - name: Vendor the kianinstall fork (pinned commit)
        run: |
          bash scripts/vendor-kianinstall.sh archiso/kian build/work
          test -f archiso/kian/airootfs/opt/kianinstall/archinstall/__main__.py \
            || { echo "ERROR: kianinstall fork was not vendored into the profile"; exit 1; }

      - name: Build ISO with mkarchiso
        run: |
          mkdir -p build/work build/out
          mkarchiso -v -w build/work -o build/out archiso/kian

      - name: Remove the vendor copy from the profile (keep the tree clean)
        if: always()
        run: bash scripts/vendor-kianinstall.sh --clean archiso/kian

      - name: Checksums
        run: |
          cd build/out
          ls -lh
          # version-independent: works for every iso_version bump
          for f in kian-os-*.iso; do sha256sum "$f" > "$f.sha256"; done
          cat kian-os-*.sha256

      # The ISO is published even if a test fails, so the artifact is never
      # lost; failed tests are then marked by the final gates below and the
      # release notes state the outcomes honestly.
      - name: Real QEMU boot test (BIOS + serial login + desktop)
        id: boottest
        continue-on-error: true
        timeout-minutes: 60
        run: |
          bash scripts/ci-boot-test.sh build/out/kian-os-*.iso build/test
          cat build/test/boot-test-summary.txt
          echo "----- serial transcript (first 120 lines) -----"
          head -120 build/test/kian-serial-transcript.txt || true
          echo "----- serial transcript (last 80 lines) -----"
          tail -80 build/test/kian-serial-transcript.txt || true

      # End-to-end proof that the installer really works: drives the REAL
      # `sudo kian-install` in QEMU against a 14 GiB virtual disk through its
      # actual prompts, then loop-mounts the installed image and verifies the
      # full Kian OS identity (os-release, fstab root entry, xenox, wallpaper,
      # Kian apps, GRUB branding, user kian). This is the test that catches
      # the "fstab came out empty" class of bugs before they reach you.
      - name: Real disk-install test (kian-install end-to-end in QEMU)
        id: installtest
        continue-on-error: true
        timeout-minutes: 90
        run: |
          truncate -s 14G build/install-test-disk.img
          TEST_RC=0
          bash scripts/ci-install-test.sh \
            build/out/kian-os-*.iso \
            build/install-test-disk.img \
            build/install-test || TEST_RC=$?
          # always show the evidence in the job log, then keep the real rc
          cat build/install-test/install-test-summary.txt || true
          echo "----- installer transcript (last 80 lines) -----"
          tail -80 build/install-test/kian-install-transcript.txt || true
          # the 14G test disk holds ~7 GB of real data by now — free it
          # before the release upload
          rm -f build/install-test-disk.img
          exit $TEST_RC

      - name: Upload build artifacts (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kian-os-0.4.1-build
          path: |
            build/out/*.iso
            build/out/*.sha256
            build/test/*
            build/install-test/*
          if-no-files-found: warn

      - name: Remove previous ISO assets from the rolling release
        if: always() && github.ref == 'refs/heads/main' && hashFiles('build/out/*.iso') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The rolling release must contain exactly ONE current ISO. The
          # filename changes on every version bump; without this step the old
          # kian-os-0.4.0 asset would sit next to the new one and users kept
          # booting the stale build (its installer died with "fstab came out
          # empty" — fixed in 82bfcac, but the filename looked identical).
          ASSETS=$(gh api "repos/${{ github.repository }}/releases/tags/latest" \
            --jq '.assets[] | select(.name | test("kian-os-.*\\.(iso|sha256)$")) | .name' 2>/dev/null || true)
          for a in $ASSETS; do
            echo "removing stale asset: $a"
            gh release delete-asset latest "$a" --yes || true
          done

      - name: Publish rolling release (main)
        if: always() && github.ref == 'refs/heads/main' && hashFiles('build/out/*.iso') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Kian OS 0.4.1 rolling build"
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Automated rolling build of Kian OS 0.4.1 "Horizon" (Linux-based).

            - commit: ${{ github.sha }}
            - built with archiso in an archlinux:base-devel container
            - QEMU boot test: **${{ steps.boottest.outcome }}**
            - disk-install test (real kian-install run in QEMU): **${{ steps.installtest.outcome }}**

            Boot it in VMware (primary target), QEMU or VirtualBox.
            Live login: `kian` / `kian`.
          files: |
            build/out/*.iso
            build/out/*.sha256

      - name: Publish tagged release (v*)
        if: always() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && hashFiles('build/out/*.iso') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Kian OS ${{ github.ref_name }}"
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Kian OS ${{ github.ref_name }} "Horizon" — Linux-based desktop operating system.

            Built with archiso (Arch Linux base). See README.md for details and
            the verification checklist.

            - QEMU boot test: **${{ steps.boottest.outcome }}**
            - disk-install test (real kian-install run in QEMU): **${{ steps.installtest.outcome }}**
          files: |
            build/out/*.iso
            build/out/*.sha256

      # Keep the run honest: the ISO is already uploaded, but failed tests
      # must still turn the workflow red.
      - name: Fail the run if a test failed
        if: steps.boottest.outcome == 'failure' || steps.installtest.outcome == 'failure'
        run: |
          echo "::error::QEMU boot test: ${{ steps.boottest.outcome }}; disk-install test: ${{ steps.installtest.outcome }}. The ISO was uploaded but is marked as failing in the release notes."
          exit 1
