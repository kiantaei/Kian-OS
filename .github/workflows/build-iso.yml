name: Build Kian OS ISO

# Builds the Linux-based Kian OS ISO with archiso inside an official
# archlinux container, runs a REAL QEMU boot test (serial login as kian,
# gcc/python/pacman checks, desktop screenshots) and publishes the ISO to
# GitHub Releases. All results shown are real build/test outputs.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm archiso grub syslinux mtools dosfstools \
            qemu-desktop expect socat

      - name: Profile sanity checks
        run: |
          bash -n archiso/kian/profiledef.sh
          bash -n build.sh
          bash -n scripts/ci-boot-test.sh
          bash -n archiso/kian/airootfs/usr/local/bin/kian-setup
          bash -n archiso/kian/airootfs/usr/bin/xenox
          bash -n archiso/kian/airootfs/usr/local/share/kian-ci/verify-commands.sh
          echo "profile sanity checks passed"

      - name: Build ISO with mkarchiso
        run: |
          mkdir -p build/work build/out
          mkarchiso -v -w build/work -o build/out archiso/kian

      - name: Checksums
        run: |
          cd build/out
          ls -lh
          sha256sum kian-os-*.iso > kian-os-0.4.0-x86_64.iso.sha256
          cat kian-os-0.4.0-x86_64.iso.sha256

      - name: Real QEMU boot test (BIOS + serial login + desktop)
        timeout-minutes: 60
        run: |
          bash scripts/ci-boot-test.sh build/out/kian-os-0.4.0-x86_64.iso build/test
          cat build/test/boot-test-summary.txt
          echo "----- serial transcript (first 120 lines) -----"
          head -120 build/test/kian-serial-transcript.txt || true
          echo "----- serial transcript (last 80 lines) -----"
          tail -80 build/test/kian-serial-transcript.txt || true

      - name: Upload build artifacts (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kian-os-0.4.0-build
          path: |
            build/out/*.iso
            build/out/*.sha256
            build/test/*
          if-no-files-found: warn

      - name: Publish rolling release (main branch)
        if: github.ref == 'refs/heads/main' && success()
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          tag: latest
          name: "Kian OS 0.4.0 rolling build"
          prerelease: true
          body: |
            Automated rolling build of Kian OS 0.4.0 "Horizon" (Linux-based).

            - commit: ${{ github.sha }}
            - built with archiso in an archlinux:base-devel container
            - passed the automated QEMU boot test (login, gcc, python, pacman, filesystem, desktop services)

            Boot it in VMware (primary target), QEMU or VirtualBox. Live login: `kian` / `kian`.
          artifacts: "build/out/kian-os-*.iso,build/out/*.sha256"

      - name: Publish tagged release (v*)
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          name: "Kian OS ${{ github.ref_name }}"
          body: |
            Kian OS ${{ github.ref_name }} "Horizon" — Linux-based desktop operating system.

            Built with archiso (Arch Linux base). See README.md for details and
            the verification checklist.
          artifacts: "build/out/kian-os-*.iso,build/out/*.sha256"
