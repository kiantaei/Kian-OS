# Kian OS syslinux menu (legacy BIOS).
# Derived from the official archiso releng profile; placeholders are
# substituted by mkarchiso at build time.

SERIAL 0 115200
UI vesamenu.c32
MENU TITLE Kian OS 0.4.0 (BIOS)
MENU BACKGROUND splash.png

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 6
MENU VSHIFT 10
MENU TABMSGROW 13
MENU CMDLINEROW 13
MENU HELPMSGROW 15
MENU HELPMSGENDROW 28

# Kian OS colors: Kian blue selection bar on dark navy
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;44 #e0ffffff #ff0078D4 all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

MENU CLEAR
MENU IMMEDIATE

DEFAULT kian
# 10 deciseconds = 1 second (press Tab/arrow keys to keep the menu open)
TIMEOUT 10

LABEL kian
TEXT HELP
Boot Kian OS 0.4.0 (Horizon) on BIOS.
A Linux-based desktop operating system.
ENDTEXT
MENU LABEL Kian OS 0.4.0 (Horizon) (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL existing
TEXT HELP
Boot an existing operating system.
Press TAB to edit the disk and partition number to boot.
ENDTEXT
MENU LABEL Boot existing OS
COM32 chain.c32
APPEND hd0 0

LABEL reboot
TEXT HELP
Reboot computer.
The computer's firmware must support APM.
ENDTEXT
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Power off computer.
The computer's firmware must support APM.
ENDTEXT
MENU LABEL Power Off
COM32 poweroff.c32
