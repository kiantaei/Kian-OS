# Kian OS GRUB configuration (UEFI).
# Derived from the official archiso releng profile; placeholders are
# substituted by mkarchiso at build time.

# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

# Kian OS boot menu background
if background_image /boot/grub/kian-grub.png; then
    set menu_color_normal=white/black
    set menu_color_highlight=black/#0078D4
    set color_normal=white/black
    set color_highlight=black/light-blue
else
    set menu_color_normal=white/black
    set menu_color_highlight=black/#0078D4
fi

# Enable serial console (used by the CI boot test and headless debugging)
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Set default menu entry (3-second timeout: the menu is still reachable with
# arrow keys, but booting does not wait for a full 5 seconds)
default=kian
timeout=3
timeout_style=menu


# Menu entries

menuentry "Kian OS 0.4.0 (Horizon) (%ARCH%, ${archiso_platform})" --class kian --class gnu-linux --class gnu --class os --id 'kian' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Kian OS 0.4.0 — hardware time in UTC" --class kian --class gnu-linux --class gnu --class os --id 'kian-utc' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% clock=hwclock=utc %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
