# Kian OS — graphics configuration (VMware / QEMU / real hardware).
#
# WHY THIS FILE EXISTS (black-screen root cause):
# The profile installs xf86-video-vesa. Xorg probes drivers in the order
# fbdev -> vesa -> modesetting, so on a VM it picked *vesa*, which cannot set
# a mode through the VMware SVGA BIOS and makes Xorg exit. LightDM then
# restarts X in a loop and the screen stays black. Forcing the modern
# modesetting DDX (KMS: vmwgfx / i915 / amdgpu / nouveau / qxl / bochs) makes
# the live session start reliably. mesa (already pulled in by chromium) gives
# modesetting its glamor/OpenGL backend.

Section "Device"
    Identifier  "Kian OS graphics"
    Driver      "modesetting"
    Option      "AccelMethod" "glamor"
EndSection

# Do not blank the screen when the VM sits idle — an idle live desktop that
# goes black looks like a crash. xfce4-power-manager keeps its own defaults.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
