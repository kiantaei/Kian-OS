# Kian OS — LightDM display manager configuration.
# Real user accounts only: the greeter is shown on logout; the live session
# auto-logs-in as `kian` (standard live-media behavior, still a real account
# with a real password — sudo keeps asking for it).
[LightDM]
run-directory=/run/lightdm

[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce
session-wrapper=/etc/lightdm/Xsession
greeter-hide-users=false
autologin-user=kian
autologin-user-timeout=0
autologin-session=xfce
