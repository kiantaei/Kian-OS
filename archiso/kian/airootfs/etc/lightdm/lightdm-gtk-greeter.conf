# Kian OS — LightDM GTK greeter (Kian design: gradient wallpaper, big clock).
[greeter]
theme-name = Materia-dark
icon-theme-name = Papirus-Dark
font-name = Liberation Sans 11
background = /usr/share/backgrounds/kian/kian-wallpaper.jpg
user-background = false
clock-format = %A, %d %B %Y   %H:%M
indicators = ~clock;~spacer;~host;~spacer;~session;~power
position = center,center,0,0
screensaver-timeout = 30

[greeter-theme]
background-color = "#1A2B4A"
font-color = "#FFFFFF"
password-border-color = "#0078D4"
password-border-width = 2px
