# Kian OS isolinux configuration (BIOS).
# timeout 10 = 1 second: the default entry auto-boots (a CI/QEMU boot with
# nobody at the menu must proceed; arrow keys still stop the countdown).
# SERIAL 0 115200 mirrors the menu to the serial console for headless tests.
SERIAL 0 115200
UI vesamenu.c32
MENU TITLE Kian OS 1.0 (Ubuntu 24.04 base)
include menu.cfg
default vesamenu.c32
prompt 0
timeout 10
