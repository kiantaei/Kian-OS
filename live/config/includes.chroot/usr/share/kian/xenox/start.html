<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Xenox — Start</title>
<style>
  :root { --navy:#1A2B4A; --purple:#3B0A45; --accent:#0078D4; --text:#E8ECF4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    font-family:'Liberation Sans', 'DejaVu Sans', sans-serif; color:var(--text);
    background:linear-gradient(180deg, var(--navy) 0%, var(--purple) 100%);
  }
  .logo { width:64px; height:64px; border-radius:14px; margin-top:12vh;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
    font-size:38px; font-weight:bold; color:#fff; box-shadow:0 6px 24px rgba(0,0,0,.45); }
  h1 { font-size:44px; margin:18px 0 4px; letter-spacing:1px; }
  h1 span { color:#4DA3FF; }
  .tag { opacity:.75; margin-bottom:34px; }
  form { width:min(640px, 88vw); }
  input[type=text] {
    width:100%; padding:15px 22px; font-size:17px; border-radius:26px; outline:none;
    border:2px solid rgba(255,255,255,.16); background:rgba(12,12,12,.55); color:var(--text);
  }
  input[type=text]:focus { border-color:var(--accent); }
  .links { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:30px; }
  .links a {
    color:var(--text); text-decoration:none; padding:9px 18px; border-radius:20px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); font-size:14px;
  }
  .links a:hover { background:var(--accent); }
  footer { margin-top:auto; padding:26px; font-size:12.5px; opacity:.62; text-align:center; line-height:1.7; }
  footer b { color:#4DA3FF; }
</style>
</head>
<body>
  <div class="logo">X</div>
  <h1><span>Xenox</span> Start</h1>
  <div class="tag">Search the web or jump to a site</div>
  <form action="https://duckduckgo.com/" method="get">
    <input type="text" name="q" placeholder="Search with DuckDuckGo or type a URL" autofocus>
  </form>
  <div class="links">
    <a href="https://github.com/kiantaei/Kian-OS">Kian OS on GitHub</a>
    <a href="https://wiki.archlinux.org/">Arch Wiki</a>
    <a href="https://www.kernel.org/">kernel.org</a>
    <a href="https://duckduckgo.com/?q=Kian+OS">About Kian OS</a>
  </div>
  <footer>
    <b>Xenox</b> runs on the real <b>Chromium engine</b> — rendering, JavaScript and
    networking are real.<br>Archived from the legacy Kian OS C++ UI in the 0.4.0
    Linux migration. Works only with an internet connection.
  </footer>
</body>
</html>
