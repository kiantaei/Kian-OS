---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false

requirements:
    requiredStorage:    10
    requiredRam:        2
    check:
        - storage
        - ram
        - power
        - root
    required:
        - root
        - storage
        - ram

# The install works fully offline (the squashfs is copied to disk);
# internet is only needed later for updates.
geoip:
    style:  "none"
    url:    ""
    selector: ""
