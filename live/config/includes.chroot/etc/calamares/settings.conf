---
# Kian OS Calamares settings — adapted from Ubuntu's own flavor settings
# (lubuntu 24.04) for the live-boot live system. All modules exist in the
# stock calamares package except automirror, which is vendored from
# calamares-settings-ubuntu-common (GPL-3+, copyright header kept).

modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - automirror
  - shellprocess@cleanup_live_only
  - umount
- show:
  - finished

branding: kian
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
