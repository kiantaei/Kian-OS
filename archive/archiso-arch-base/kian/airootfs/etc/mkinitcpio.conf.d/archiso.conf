# Local ISO/VM boot: the PXE hooks (archiso_pxe_*) are not used by a disk or
# VM boot and only add initramfs size and init time, so they are trimmed.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
# zstd decompresses far faster than xz -9e (that -9e is what made early boot
# feel slow); archiso's early userspace unpacks this initramfs on every boot.
COMPRESSION="zstd"
