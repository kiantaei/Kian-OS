[package]
name = "kian-kernel"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[profile.release]
opt-level = 2
panic = "abort"

[profile.dev]
panic = "abort"

[dependencies]
spin = "0.9"
x86_64 = "0.15"
linked_list_allocator = "0.1"
lazy_static = "1.4"
volatile = "0.4"
